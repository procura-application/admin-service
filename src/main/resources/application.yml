spring:
  datasource:
      driver-class-name: org.postgresql.Driver
      url: ${DB_URL}
      username: ${DB_USER}
      password: ${DB_PASSWORD}
  jpa:
      hibernate:
        ddl-auto: update
      show-sql: true
      properties:
        hibernate:
          format_sql: true
      database: postgresql
      database-platform: org.hibernate.dialect.PostgreSQLDialect
  application:
    name: admin
application:
 security:
    jwt:
      secret:
         key: ${JWT_KEY}
         expiration: ${JWT_EXPIRATION}
server:
   servlet:
     context-path: /eprocurement/api/internal/admin
   port: 9003



